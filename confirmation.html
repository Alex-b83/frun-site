<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101012">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Confirmation du compte | FRUN</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; background: radial-gradient(ellipse at 50% 0%, #352016 0%, #101012 52%); color: #fff; display: flex; align-items: center; justify-content: center; padding: 24px; }
    main { width: min(100%, 440px); text-align: center; background: #202023; border: 1px solid #393034; border-radius: 22px; padding: 36px 26px; box-shadow: 0 24px 65px #0006; }
    .logo { font-size: 58px; font-weight: 950; letter-spacing: -4px; line-height: 1; margin-bottom: 9px; }
    .logo span { color: #ff8a00; }
    .tagline { font-size: 13px; color: #c5bfc0; margin: 0 0 27px; }
    .rule { height: 3px; width: 64px; margin: 0 auto 27px; background: #ff7417; border-radius: 9px; }
    .symbol { display: inline-flex; align-items: center; justify-content: center; width: 65px; height: 65px; border: 2px solid #ff7417; border-radius: 50%; color: #ff8a00; font-size: 32px; font-weight: bold; margin-bottom: 16px; }
    h1 { font-size: 25px; line-height: 1.2; margin: 0 0 13px; }
    p { font-size: 15px; line-height: 1.65; color: #ddd; margin: 0; }
    .note { font-size: 13px; color: #a9a9ae; margin-top: 22px; }
    button { display: block; width: 100%; margin: 24px 0 0; padding: 17px 14px; background: #ff7417; border: 0; border-radius: 12px; color: #151515; font-size: 14px; font-weight: 850; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    button[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="logo">FRU<span>N</span></div>
    <p class="tagline">Défie tes amis. Repousse tes limites.</p>
    <div class="rule"></div>
    <div class="symbol" id="symbol" aria-hidden="true">✉</div>
    <h1 id="title">Confirme ton adresse e-mail</h1>
    <p id="message" role="status" aria-live="polite">Pour activer ton compte FRUN, appuie sur le bouton ci-dessous.</p>
    <button id="confirm" type="button" hidden>CONFIRMER MON ADRESSE E-MAIL</button>
    <p class="note">FRUN · FRIENDS. RUN. FUN.</p>
  </main>
  <script>
    (() => {
      const title = document.getElementById('title');
      const message = document.getElementById('message');
      const symbol = document.getElementById('symbol');
      const button = document.getElementById('confirm');
      const show = (sign, heading, detail) => {
        symbol.textContent = sign;
        title.textContent = heading;
        message.textContent = detail;
      };
      const query = new URLSearchParams(location.search);
      const fragment = new URLSearchParams(location.hash.slice(1));
      const tokenHash = fragment.get('token_hash') || query.get('token_hash');
      const type = fragment.get('type') || query.get('type');
      const error = fragment.get('error_description') || query.get('error_description') || fragment.get('error') || query.get('error');
      // Retirer le jeton de l'URL avant toute action. Aucune requête de confirmation automatique.
      history.replaceState(null, '', location.pathname);
      if (error) {
        show('!', 'Lien invalide ou expiré', 'Demande un nouvel e-mail de confirmation depuis FRUN, ou essaie de te connecter si ton compte a déjà été activé.');
        return;
      }
      if (!tokenHash || type !== 'signup') {
        show('!', 'Lien de confirmation requis', 'Ouvre cette page depuis le dernier e-mail de confirmation FRUN.');
        return;
      }
      button.hidden = false;
      button.addEventListener('click', async () => {
        button.disabled = true;
        button.textContent = 'CONFIRMATION EN COURS…';
        show('…', 'Activation en cours…', 'Nous confirmons ton adresse e-mail auprès de FRUN.');
        try {
          const response = await fetch('https://rkgwummefcvsdevknvsp.supabase.co/auth/v1/verify', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': 'sb_publishable_Az9FBAYAQJSNQioJgfGIWw_f8yonl11'
            },
            body: JSON.stringify({ token_hash: tokenHash, type: 'signup' }),
            cache: 'no-store'
          });
          if (!response.ok) throw new Error('Confirmation refusée');
          button.hidden = true;
          show('✓', 'Bienvenue sur FRUN !', 'Ton adresse e-mail est confirmée. Retourne dans l’application FRUN et connecte-toi.');
        } catch (_) {
          button.hidden = true;
          show('!', 'Confirmation non effectuée', 'Ce lien est peut-être expiré ou déjà utilisé. Essaie de te connecter dans FRUN ; si cela échoue, demande un nouveau lien de confirmation.');
        }
      }, { once: true });
    })();
  </script>
</body>
</html>
