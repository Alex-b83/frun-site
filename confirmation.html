<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101012">
  <meta name="robots" content="noindex, nofollow">
  <title>Confirmation du compte | FRUN</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; background: radial-gradient(ellipse at 50% 0%, #352016 0%, #101012 52%); color: #fff; display: flex; align-items: center; justify-content: center; padding: 24px; }
    main { width: min(100%, 440px); text-align: center; background: #202023; border: 1px solid #393034; border-radius: 22px; padding: 36px 26px; box-shadow: 0 24px 65px #0006; }
    .logo { font-size: 58px; font-weight: 950; letter-spacing: -4px; line-height: 1; margin-bottom: 9px; }
    .logo span { color: #ff8a00; }
    .tagline { font-size: 13px; color: #c5bfc0; margin: 0 0 27px; }
    .rule { height: 3px; width: 64px; margin: 0 auto 27px; background: #ff7417; border-radius: 9px; }
    .symbol { display: inline-flex; align-items: center; justify-content: center; width: 65px; height: 65px; border: 2px solid #ff7417; border-radius: 50%; color: #ff8a00; font-size: 32px; font-weight: bold; margin-bottom: 16px; }
    h1 { font-size: 25px; line-height: 1.2; margin: 0 0 13px; }
    p { font-size: 15px; line-height: 1.65; color: #ddd; margin: 0; }
    .note { font-size: 13px; color: #a9a9ae; margin-top: 22px; }
    .orange { color: #ff9b3b; }
  </style>
</head>
<body>
  <main>
    <div class="logo">FRU<span>N</span></div>
    <p class="tagline">Défie tes amis. Repousse tes limites.</p>
    <div class="rule"></div>
    <div class="symbol" id="symbol" aria-hidden="true">…</div>
    <h1 id="title">Vérification en cours…</h1>
    <p id="message" role="status" aria-live="polite">Nous vérifions la confirmation de ton adresse e-mail.</p>
    <p class="note">FRUN · FRIENDS. RUN. FUN.</p>
  </main>
  <script>
    (async () => {
      const title = document.getElementById('title');
      const message = document.getElementById('message');
      const symbol = document.getElementById('symbol');
      const show = (ok, heading, detail) => {
        symbol.textContent = ok ? '✓' : '!';
        title.textContent = heading;
        message.textContent = detail;
      };
      const query = new URLSearchParams(location.search);
      const fragment = new URLSearchParams(location.hash.slice(1));
      const error = query.get('error_description') || fragment.get('error_description') || query.get('error') || fragment.get('error');
      // Supprime immédiatement les jetons de l'historique et de la barre d'adresse.
      const accessToken = fragment.get('access_token');
      const refreshToken = fragment.get('refresh_token');
      const type = fragment.get('type') || query.get('type');
      history.replaceState(null, '', location.pathname);
      if (error) {
        show(false, 'Confirmation impossible', 'Ce lien est invalide ou expiré. Retourne dans FRUN et demande un nouvel e-mail de confirmation.');
        return;
      }
      if (!accessToken || !refreshToken || (type && type !== 'signup')) {
        show(false, 'Lien de confirmation requis', 'Ouvre cette page depuis le lien de confirmation reçu par e-mail. Si tu as déjà confirmé ton compte, essaie simplement de te connecter dans FRUN.');
        return;
      }
      try {
        // Vérifie le jeton auprès de Supabase : la seule présence de paramètres ne suffit pas.
        const response = await fetch('https://rkgwummefcvsdevknvsp.supabase.co/auth/v1/user', {
          method: 'GET',
          headers: {
            'apikey': 'sb_publishable_Az9FBAYAQJSNQioJgfGIWw_f8yonl11',
            'Authorization': 'Bearer ' + accessToken
          },
          cache: 'no-store'
        });
        if (!response.ok) throw new Error('Verification failed');
        const user = await response.json();
        if (!user || !user.email_confirmed_at) throw new Error('Email not confirmed');
        show(true, 'Bienvenue sur FRUN !', 'Ton adresse e-mail est confirmée et ton compte est activé. Tu peux maintenant retourner dans l’application FRUN et te connecter.');
      } catch (_) {
        show(false, 'Confirmation à vérifier', 'Nous ne pouvons pas vérifier ton compte pour le moment. Essaie de te connecter dans FRUN ; si cela ne fonctionne pas, demande un nouveau lien de confirmation.');
      }
    })();
  </script>
</body>
</html>
